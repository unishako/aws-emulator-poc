name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ビルドとテスト
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # コミットされた gradle-wrapper.jar が、Gradle 公式のものか検証する
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build

  integration-test:
    name: 結合テスト (AWS Emulator + アプリ)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # GitHub Actions のランナーは x86_64
      RPM_ARCH: x86_64
    steps:
      - uses: actions/checkout@v7
      - name: 起動
        run: |
          mkdir -p .emulator
          echo "LOCAL_UID=$(id -u)" >> .env
          echo "LOCAL_GID=$(id -g)" >> .env
          docker compose up -d --build --wait
      - name: PUT / GET の確認
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/ -o /dev/null && break
            sleep 2
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H 'Content-Type: text/plain' --data 'hello' http://127.0.0.1:8080/api/objects/hello.txt)" = "201"
          test "$(curl -s http://127.0.0.1:8080/api/objects/hello.txt)" = "hello"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/objects/nothing.txt)" = "404"
      - name: 失敗時のログ
        if: failure()
        run: docker compose logs --no-color
      - name: 後片付け
        if: always()
        run: docker compose down -v
